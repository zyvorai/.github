<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Zyvor — open infrastructure for migration, Kubernetes, and the edge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1c1208"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff5a15" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cc420a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff5a15"/>
      <stop offset="1" stop-color="#f0583a"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="220" fill="url(#flare)" filter="url(#blur1)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- Wordmark -->
  <text x="64" y="104" fill="#f1f5f9" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">ZYVOR</text>
  <text x="64" y="140" fill="url(#accentText)" font-family="system-ui,sans-serif" font-size="21" font-weight="700" letter-spacing="0.05em">Open infrastructure for the post-legacy estate</text>
  <text x="64" y="172" fill="#aeb9c8" font-family="system-ui,sans-serif" font-size="16">Migrate off proprietary hypervisors &amp; HCI · run on Kubernetes &amp; KubeVirt · operate at the edge</text>

  <!-- Flow chips -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600">
    <rect x="64" y="200" width="108" height="34" rx="8" fill="rgba(255,90,21,0.12)" stroke="rgba(255,90,21,0.4)"/>
    <text x="118" y="222" text-anchor="middle" fill="#ff8f3f">Migrate</text>

    <path d="M180 217 h26" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="214" y="200" width="88" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
    <text x="258" y="222" text-anchor="middle" fill="#e4e7ec">Run</text>

    <path d="M310 217 h26" stroke="#52525b" stroke-width="2"/>
    <rect x="344" y="200" width="108" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
    <text x="398" y="222" text-anchor="middle" fill="#e4e7ec">Operate</text>

    <path d="M460 217 h26" stroke="#52525b" stroke-width="2"/>
    <rect x="494" y="200" width="88" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
    <text x="538" y="222" text-anchor="middle" fill="#e4e7ec">Scale</text>
  </g>

  <!-- Stat rail -->
  <g font-family="system-ui,sans-serif">
    <text x="64" y="270" fill="#f1f5f9" font-size="26" font-weight="800">96.8%</text>
    <text x="64" y="288" fill="#71717a" font-size="12">first-boot success</text>

    <line x1="188" y1="248" x2="188" y2="288" stroke="rgba(255,255,255,0.12)"/>

    <text x="212" y="270" fill="#f1f5f9" font-size="26" font-weight="800">11</text>
    <text x="212" y="288" fill="#71717a" font-size="12">integration targets</text>

    <line x1="372" y1="248" x2="372" y2="288" stroke="rgba(255,255,255,0.12)"/>

    <text x="396" y="270" fill="#f1f5f9" font-size="26" font-weight="800">Apache-2.0</text>
    <text x="396" y="288" fill="#71717a" font-size="12">core toolkit, open source</text>
  </g>
</svg>
