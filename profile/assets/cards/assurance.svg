<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="Assurance: Argus, Kairo, KubeFlight, Kavira.">
  <style>
    .t { font-family: system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    .m { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .bar { animation: sweep 4s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 100% { transform: translateX(420px); } }
    .ic { animation: breathe 3.5s ease-in-out infinite; transform-origin: 52px 56px; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141418"/><stop offset="1" stop-color="#0b1524"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#db2777" stop-opacity="0"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="420" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="420" height="220" fill="url(#bg)"/>
    <rect class="bar" width="160" height="3" fill="url(#sh)"/>
  </g>
  <rect x=".5" y=".5" width="419" height="219" rx="16" fill="none" stroke="rgba(255,255,255,.1)"/>
  <g class="ic" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M52 30l20 8v14c0 12-8 20-20 26-12-6-20-14-20-26V38z"/>
    <path d="M43 54l7 7 12-14"/>
  </g>
  <text class="t" x="96" y="56" fill="#f5f5f7" font-size="24" font-weight="800">Assurance</text>
  <text class="t" x="96" y="78" fill="#f9a8d4" font-size="13" font-weight="600">Know before you ship.</text>
  <text class="t" x="30" y="118" fill="#c4c4cc" font-size="15">Specs to evidence, blast radius and preflight</text>
  <text class="t" x="30" y="140" fill="#c4c4cc" font-size="15">before and after every deploy.</text>
    <g class="m" font-size="12" font-weight="600">
    <rect x="30" y="166" width="64" height="26" rx="13" fill="rgba(244,114,182,.14)" stroke="rgba(244,114,182,.45)"/><text x="62" y="183" fill="#fbcfe8" text-anchor="middle">Argus</text>
    <rect x="102" y="166" width="64" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="134" y="183" fill="#e4e4ea" text-anchor="middle">Kairo</text>
    <rect x="174" y="166" width="92" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="220" y="183" fill="#e4e4ea" text-anchor="middle">KubeFlight</text>
    <rect x="274" y="166" width="72" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="310" y="183" fill="#e4e4ea" text-anchor="middle">Kavira</text>
  </g>
</svg>
