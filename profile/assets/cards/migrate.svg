<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="Migrate: leave proprietary hypervisors. Transiva, GuestKit, h2kvm, Scout.">
  <style>
    .t { font-family: system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    .m { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .bar { animation: sweep 4s ease-in-out infinite; animation-delay: 1.2s; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 100% { transform: translateX(420px); } }
    .mv { animation: move 2.6s ease-in-out infinite; }
    @keyframes move { 0%,15% { transform: translateX(0); opacity: 1; } 70% { transform: translateX(26px); opacity: 1; } 85%,100% { transform: translateX(26px); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141418"/><stop offset="1" stop-color="#1f140c"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff5a15" stop-opacity="0"/><stop offset=".5" stop-color="#ff7a2e"/><stop offset="1" stop-color="#ff5a15" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="420" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="420" height="220" fill="url(#bg)"/>
    <rect class="bar" width="160" height="3" fill="url(#sh)"/>
  </g>
  <rect x=".5" y=".5" width="419" height="219" rx="16" fill="none" stroke="rgba(255,255,255,.1)"/>
  <g fill="none" stroke="#ff7a2e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="26" y="38" width="22" height="32" rx="4" stroke-opacity=".5"/>
    <rect x="58" y="38" width="22" height="32" rx="4"/>
    <rect class="mv" x="31" y="48" width="12" height="12" rx="2" fill="#ff7a2e"/>
  </g>
  <text class="t" x="96" y="56" fill="#f5f5f7" font-size="24" font-weight="800">Migrate</text>
  <text class="t" x="96" y="78" fill="#ff8f4f" font-size="13" font-weight="600">Exit legacy hypervisors, honestly.</text>
  <text class="t" x="30" y="118" fill="#c4c4cc" font-size="15">Discover, export, convert and inspect VM</text>
  <text class="t" x="30" y="140" fill="#c4c4cc" font-size="15">disks offline. Zero boot, zero agents.</text>
  <g class="m" font-size="12" font-weight="600">
    <rect x="30" y="166" width="80" height="26" rx="13" fill="rgba(255,90,21,.14)" stroke="rgba(255,90,21,.45)"/><text x="70" y="183" fill="#ffb088" text-anchor="middle">Transiva</text>
    <rect x="118" y="166" width="80" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="158" y="183" fill="#e4e4ea" text-anchor="middle">GuestKit</text>
    <rect x="206" y="166" width="62" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="237" y="183" fill="#e4e4ea" text-anchor="middle">h2kvm</text>
    <rect x="276" y="166" width="62" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="307" y="183" fill="#e4e4ea" text-anchor="middle">Scout</text>
  </g>
</svg>
