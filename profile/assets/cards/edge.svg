<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="Edge and IoT: offline-first runtime, fleets and signed OTA. Nodra, Fleet, Device Agent, OTA.">
  <style>
    .t { font-family: system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    .m { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .bar { animation: sweep 4s ease-in-out infinite; animation-delay: 3s; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 100% { transform: translateX(420px); } }
    .ring { animation: ping 2.4s ease-out infinite; transform-origin: 52px 54px; }
    .r2 { animation-delay: 1.2s; }
    @keyframes ping { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141418"/><stop offset="1" stop-color="#0b1524"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0071e3" stop-opacity="0"/><stop offset=".5" stop-color="#2997ff"/><stop offset="1" stop-color="#0071e3" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="420" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="420" height="220" fill="url(#bg)"/>
    <rect class="bar" width="160" height="3" fill="url(#sh)"/>
  </g>
  <rect x=".5" y=".5" width="419" height="219" rx="16" fill="none" stroke="rgba(255,255,255,.1)"/>
  <circle class="ring" cx="52" cy="54" r="20" fill="none" stroke="#2997ff" stroke-width="2"/>
  <circle class="ring r2" cx="52" cy="54" r="20" fill="none" stroke="#2997ff" stroke-width="2"/>
  <circle cx="52" cy="54" r="7" fill="#2997ff"/>
  <text class="t" x="96" y="56" fill="#f5f5f7" font-size="24" font-weight="800">Edge &amp; IoT</text>
  <text class="t" x="96" y="78" fill="#6cb4ff" font-size="13" font-weight="600">Works when the cloud doesn't.</text>
  <text class="t" x="30" y="118" fill="#c4c4cc" font-size="15">Offline-first runtime, device twins, fleet</text>
  <text class="t" x="30" y="140" fill="#c4c4cc" font-size="15">control and signed A/B OS updates.</text>
  <g class="m" font-size="12" font-weight="600">
    <rect x="30" y="166" width="64" height="26" rx="13" fill="rgba(41,151,255,.14)" stroke="rgba(41,151,255,.45)"/><text x="62" y="183" fill="#a8d1ff" text-anchor="middle">Nodra</text>
    <rect x="102" y="166" width="64" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="134" y="183" fill="#e4e4ea" text-anchor="middle">Fleet</text>
    <rect x="174" y="166" width="104" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="226" y="183" fill="#e4e4ea" text-anchor="middle">Device Agent</text>
    <rect x="286" y="166" width="52" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="312" y="183" fill="#e4e4ea" text-anchor="middle">OTA</text>
  </g>
</svg>
