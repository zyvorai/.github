<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="Virtualize: real VMs with a real API. FluxVM, Machina, Fabric.">
  <style>
    .t { font-family: system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    .m { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .bar { animation: sweep 4s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 100% { transform: translateX(420px); } }
    .ic { animation: breathe 3.5s ease-in-out infinite; transform-origin: 52px 56px; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141418"/><stop offset="1" stop-color="#0b1524"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0071e3" stop-opacity="0"/><stop offset=".5" stop-color="#2997ff"/><stop offset="1" stop-color="#0071e3" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="420" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="420" height="220" fill="url(#bg)"/>
    <rect class="bar" width="160" height="3" fill="url(#sh)"/>
  </g>
  <rect x=".5" y=".5" width="419" height="219" rx="16" fill="none" stroke="rgba(255,255,255,.1)"/>
  <g class="ic" fill="none" stroke="#2997ff" stroke-width="2.5" stroke-linejoin="round">
    <rect x="30" y="34" width="44" height="30" rx="5"/>
    <path d="M40 72h24M52 64v8"/>
    <path d="M38 44h12M38 52h20" stroke-linecap="round"/>
  </g>
  <text class="t" x="96" y="56" fill="#f5f5f7" font-size="24" font-weight="800">Virtualize</text>
  <text class="t" x="96" y="78" fill="#6cb4ff" font-size="13" font-weight="600">Real VMs. Real API.</text>
  <text class="t" x="30" y="118" fill="#c4c4cc" font-size="15">Firecracker, Cloud Hypervisor, QEMU/KVM</text>
  <text class="t" x="30" y="140" fill="#c4c4cc" font-size="15">and our own hypervisor. No libvirtd, no XML.</text>
  <g class="m" font-size="12" font-weight="600">
    <rect x="30" y="166" width="72" height="26" rx="13" fill="rgba(41,151,255,.14)" stroke="rgba(41,151,255,.45)"/><text x="66" y="183" fill="#a8d1ff" text-anchor="middle">FluxVM</text>
    <rect x="110" y="166" width="80" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="150" y="183" fill="#e4e4ea" text-anchor="middle">Machina</text>
    <rect x="198" y="166" width="70" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="233" y="183" fill="#e4e4ea" text-anchor="middle">Fabric</text>
  </g>
</svg>
