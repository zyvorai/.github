<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="eBPF networking: see every flow. Netra, Paqtra, Rivora, Shukra.">
  <style>
    .t { font-family: system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    .m { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .bar { animation: sweep 4s ease-in-out infinite; animation-delay: 2.4s; }
    @keyframes sweep { 0% { transform: translateX(-160px); } 100% { transform: translateX(420px); } }
    .wave { stroke-dasharray: 120; animation: trace 2.8s linear infinite; }
    @keyframes trace { from { stroke-dashoffset: 120; } to { stroke-dashoffset: -120; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141418"/><stop offset="1" stop-color="#1f140c"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff5a15" stop-opacity="0"/><stop offset=".5" stop-color="#ff7a2e"/><stop offset="1" stop-color="#ff5a15" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="420" height="220" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="420" height="220" fill="url(#bg)"/>
    <rect class="bar" width="160" height="3" fill="url(#sh)"/>
  </g>
  <rect x=".5" y=".5" width="419" height="219" rx="16" fill="none" stroke="rgba(255,255,255,.1)"/>
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 54h12l6-16 10 32 8-24 6 8h12" stroke="#ff7a2e" stroke-opacity=".25"/>
    <path class="wave" d="M26 54h12l6-16 10 32 8-24 6 8h12" stroke="#ff7a2e"/>
  </g>
  <text class="t" x="96" y="56" fill="#f5f5f7" font-size="24" font-weight="800">eBPF Networking</text>
  <text class="t" x="96" y="78" fill="#ff8f4f" font-size="13" font-weight="600">Trace every flow. Drop nothing silently.</text>
  <text class="t" x="30" y="118" fill="#c4c4cc" font-size="15">Kernel-level observability, load balancing</text>
  <text class="t" x="30" y="140" fill="#c4c4cc" font-size="15">and runtime security for Linux and KVM.</text>
  <g class="m" font-size="12" font-weight="600">
    <rect x="30" y="166" width="64" height="26" rx="13" fill="rgba(255,90,21,.14)" stroke="rgba(255,90,21,.45)"/><text x="62" y="183" fill="#ffb088" text-anchor="middle">Netra</text>
    <rect x="102" y="166" width="72" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="138" y="183" fill="#e4e4ea" text-anchor="middle">Paqtra</text>
    <rect x="182" y="166" width="72" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="218" y="183" fill="#e4e4ea" text-anchor="middle">Rivora</text>
    <rect x="262" y="166" width="72" height="26" rx="13" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/><text x="298" y="183" fill="#e4e4ea" text-anchor="middle">Shukra</text>
  </g>
</svg>
